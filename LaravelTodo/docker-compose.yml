services:
  app:
    build: .
    ports:
      - "3000:8181"
    depends_on:
      - db
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=todo
      - DB_USERNAME=root
      - DB_PASSWORD=root123
    volumes:
      - .:/app
    networks:
      - laravel-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: todo
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel-network

volumes:
  mysql_data:

networks:
  laravel-network:
    driver: bridge